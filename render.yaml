# Render Blueprint: one Node web service (API + built React app) and one Postgres database.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Then set ANTHROPIC_API_KEY (optional).
databases:
  - name: bookleaf-db
    plan: free
    databaseName: bookleaf
    user: bookleaf

services:
  - type: web
    name: bookleaf-author-portal
    runtime: node
    plan: free
    # --include=dev because TypeScript/Vite are dev dependencies and NODE_ENV is production.
    buildCommand: npm ci --include=dev && npm run build
    # Applies migrations, runs the idempotent seed, then starts Express (which also serves client/dist).
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: AI_MODEL
        value: claude-haiku-5-5
      - key: ANTHROPIC_API_KEY
        sync: false # set in the dashboard; leave empty to run in fallback mode
